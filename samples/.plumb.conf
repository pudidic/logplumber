# plumb configuration for the sample logs (see README: "Sourcetypes and .plumb.conf").
# Run "config" inside plumb to see what is loaded.

# A format no built-in sourcetype knows:
#   14.10.2026 09:00:05,759 INFO  [payment-svc] order 7165 charged 5600 KRW in 804ms (card=local) approved
[sourcetype:payments]
source = payments*.log
extract = ^(?<ts>\d\d\.\d\d\.\d{4} \d\d:\d\d:\d\d,\d{3}) (?<level>\w+)\s+\[(?<service>[^\]]+)\] order (?<order>\d+) charged (?<amount>\d+) (?<currency>[A-Z]{3}) in (?<ms>\d+)ms \(card=(?<card>\w+)\) (?<outcome>\w+)$
time_field = ts
time_format = %d.%m.%Y %H:%M:%S,%3N
eval = amount_k = round(amount / 1000, 1)
eval = slow = if(ms > 500, "yes", "no")

# Additions to a built-in sourcetype
[sourcetype:access_combined]
alias = clientip AS src_ip
eval = status_class = substr(status, 1, 1) + "xx"

# Macros: `errors`, `slow(1000)`
[macro:errors]
definition = (level=error OR log_level=error OR status>=500)

[macro:slow(1)]
args = ms
definition = (ms>$ms$ OR duration_ms>$ms$)

# Saved searches: savedsearch failed-logins
[search:failed-logins]
search = sourcetype=syslog "Failed password" | rex "from (?<ip>\S+) port" | top ip

[search:declined-payments]
search = sourcetype=payments outcome!=approved | timechart span=10m count by outcome
